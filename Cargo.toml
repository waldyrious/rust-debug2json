[package]
name = "rust-debug2json"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"] # Compile as a dynamic library for Wasm

[dependencies]
regex = "1.12"
wasm-bindgen = "0.2"
serde_dbgfmt = "0.1.1"
serde_json = { version = "1.0", features = ["preserve_order"] }

[dev-dependencies]
indoc = "2.0"
